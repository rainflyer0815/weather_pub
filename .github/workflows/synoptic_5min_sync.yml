name: 5min Feed Sync (MADIS + METAR)

on:
  # Nur workflow_dispatch – externer Trigger via cron-job.org (1x pro Minute).
  # Dateiname bleibt synoptic_5min_sync.yml, damit die Dispatch-URL bei
  # cron-job.org unverändert weiter funktioniert.
  workflow_dispatch:

concurrency:
  group: synoptic-5min-sync
  # Läufe überlappen sich nicht; ein neuer wartet statt abzubrechen.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll MADIS/AWC feeds and store new rows
        env:
          MADIS_STATION: KLGA
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pip install pymysql netCDF4 numpy
          python3 poll_madis_hfmetar.py

      - name: Report DB fill
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python3 report_synoptic_db.py
