name: MADIS 5min Feed Sync

on:
  # Nur workflow_dispatch – externer Trigger via cron-job.org (alle 2 Min).
  # Dispatch-URL: .../actions/workflows/madis_5min_sync.yml/dispatches
  workflow_dispatch:

concurrency:
  group: madis-5min-sync
  # Läufe überlappen sich nicht; ein neuer wartet statt abzubrechen.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll MADIS/AWC feeds and store new rows
        env:
          MADIS_STATION: KLGA
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install pymysql netCDF4 numpy
          python3 poll_madis_hfmetar.py --hours-back 1

      - name: Report DB fill
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python3 report_synoptic_db.py
